name: Weekly community table

on:
  schedule:
    - cron: '0 15 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: weekly-community-table
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aggregate accepted Issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/aggregate.py
      - name: Commit changed tables
        run: |
          git add -- community-table.json community-table.md
          if git diff --cached --quiet -- community-table.json community-table.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update weekly community table' -- community-table.json community-table.md
          git push origin HEAD:main
